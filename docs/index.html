    gameLives = 3;
    gameSpeed = 4;
    mickeyY = 280;
    mickeyVelY = 0;
    isJumping = false;
    obstacles = [];
    words = [];
    frameCount = 0;
    spawnTimer = 0;
    gameRunning = true;
    document.getElementById('gameStartBtn').style.display = 'none';
    document.getElementById('gameShareBtn').style.display = 'none';
    updateGameHUD();
    canvas.addEventListener('click', handleGameJump);
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleGameJump(); });
    gameLoopId = requestAnimationFrame(gameLoop);
}

function handleGameJump() {
    if (!gameRunning) return;
    if (!isJumping) {
        mickeyVelY = -12;
        isJumping = true;
    }
}

function gameLoop() {
    if (!gameRunning) return;
    updateGame();
    drawGame();
    gameLoopId = requestAnimationFrame(gameLoop);
}

function updateGame() {
    frameCount++;
    // Гравитация
    mickeyVelY += 0.6;
    mickeyY += mickeyVelY;
    if (mickeyY >= 280) {
        mickeyY = 280;
        mickeyVelY = 0;
        isJumping = false;
    }

    // Спавн препятствий и слов
    spawnTimer++;
    if (spawnTimer > 80 - gameSpeed * 5) {
        spawnTimer = 0;
        if (Math.random() < 0.5) {
            // Препятствие
            obstacles.push({ x: 400, y: 280, w: 20, h: 30 });
        } else {
            // Слово
            const wordPair = gameWords[Math.floor(Math.random() * gameWords.length)];
            const isCorrect = Math.random() < 0.5;
            words.push({
                x: 400,
                y: 150 + Math.random() * 100,
                text: isCorrect ? wordPair.ru : wordPair.en,
                correct: isCorrect,
                pair: wordPair,
                collected: false
            });
        }
    }

    // Движение препятствий
    for (let obs of obstacles) {
        obs.x -= gameSpeed;
        // Проверка столкновения с Микки
        if (
            obs.x < 50 && obs.x + obs.w > 20 &&
            mickeyY + 40 > obs.y && mickeyY < obs.y + obs.h
        ) {
            gameLives--;
            obstacles = obstacles.filter(o => o !== obs);
            updateGameHUD();
            if (gameLives <= 0) {
                gameOver();
                return;
            }
        }
    }
    obstacles = obstacles.filter(obs => obs.x > -50);

    // Движение слов
    for (let w of words) {
        w.x -= gameSpeed;
        // Проверка сбора
        if (!w.collected && w.x < 50 && w.x > 10 &&
            mickeyY + 40 > w.y - 10 && mickeyY < w.y + 30) {
            w.collected = true;
            if (w.correct) {
                gameScore += 10;
                updateGameHUD();
            } else {
                gameLives--;
                updateGameHUD();
                if (gameLives <= 0) {
                    gameOver();
                    return;
                }
            }
        }
    }
    words = words.filter(w => w.x > -50 && !w.collected);

    // Увеличение скорости
    if (gameScore > 0 && gameScore % 50 === 0) {
        gameSpeed += 0.2;
    }
}

function drawGame() {
    ctx.clearRect(0, 0, 380, 400);

    // Небо
    ctx.fillStyle = '#87CEEB';
    ctx.fillRect(0, 0, 380, 280);
    // Земля
    ctx.fillStyle = '#8B4513';
    ctx.fillRect(0, 310, 380, 90);

    // Микки (пиксельный кот)
    ctx.fillStyle = '#FFD9B0';
    ctx.fillRect(30, mickeyY, 20, 20); // тело
    ctx.fillStyle = '#000';
    ctx.fillRect(32, mickeyY + 4, 4, 4); // глаз
    ctx.fillRect(40, mickeyY + 4, 4, 4); // глаз
    ctx.fillStyle = '#FFC489';
    ctx.fillRect(26, mickeyY + 12, 6, 4); // лапа
    ctx.fillRect(44, mickeyY + 12, 6, 4); // лапа

    // Препятствия
    ctx.fillStyle = '#555';
    for (let obs of obstacles) {
        ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
        // шипы
        ctx.fillStyle = '#FF0000';
        ctx.fillRect(obs.x + 2, obs.y - 5, 4, 5);
        ctx.fillRect(obs.x + 14, obs.y - 5, 4, 5);
        ctx.fillStyle = '#555';
    }

    // Слова
    ctx.font = '10px "Press Start 2P"';
    for (let w of words) {
        ctx.fillStyle = w.correct ? '#00AA00' : '#AA0000';
        ctx.fillText(w.text, w.x, w.y);
    }

    // HUD внутри canvas (мелкий шрифт)
    ctx.fillStyle = '#000';
    ctx.font = '8px "Press Start 2P"';
    ctx.fillText('⭐ ' + gameScore, 10, 15);
    ctx.fillText('❤️'.repeat(gameLives), 300, 15);
}

function updateGameHUD() {
    document.getElementById('gameScore').textContent = '⭐ ' + gameScore;
    document.getElementById('gameLives').textContent = '❤️'.repeat(gameLives) + '🖤'.repeat(3 - gameLives);
    document.getElementById('gameBest').textContent = '🏆 ' + (localStorage.getItem('mickeyRunnerBest') || 0);
}

function gameOver() {
    gameRunning = false;
    cancelAnimationFrame(gameLoopId);
    canvas.removeEventListener('click', handleGameJump);
    canvas.removeEventListener('touchstart', handleGameJump);
    document.getElementById('gameStartBtn').style.display = 'inline-block';
    document.getElementById('gameStartBtn').textContent = '🔄 Заново';
    document.getElementById('gameShareBtn').style.display = 'inline-block';
    const best = parseInt(localStorage.getItem('mickeyRunnerBest') || 0);
    if (gameScore > best) {
        localStorage.setItem('mickeyRunnerBest', gameScore);
        document.getElementById('gameBest').textContent = '🏆 ' + gameScore;
    }
    updateGameHUD();
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, 380, 400);
    ctx.fillStyle = '#FFF';
    ctx.font = '12px "Press Start 2P"';
    ctx.fillText('GAME OVER', 120, 180);
    ctx.font = '8px "Press Start 2P"';
    ctx.fillText('Score: ' + gameScore, 150, 210);
}

function shareGameScore() {
    const best = localStorage.getItem('mickeyRunnerBest') || 0;
    const text = `🐱 Я набрал ${gameScore} очков в Mickey Runner! (Рекорд: ${best})\nПопробуй Englify: https://t.me/engliFLY_bot`;
    if (navigator.share) {
        navigator.share({ title: 'Mickey Runner', text: text });
    } else {
        // Копируем в буфер обмена
        navigator.clipboard.writeText(text).then(() => {
            alert('Результат скопирован! Отправь другу.');
        });
    }
}

// ===== WORD BUILDER GAME =====
let builderWords = [
    { en: "cat", ru: "кошка" },
    { en: "dog", ru: "собака" },
    { en: "house", ru: "дом" },
    { en: "car", ru: "машина" },
    { en: "book", ru: "книга" },
    { en: "apple", ru: "яблоко" },
    { en: "sun", ru: "солнце" },
    { en: "moon", ru: "луна" },
    { en: "star", ru: "звезда" },
    { en: "happy", ru: "счастливый" },
    { en: "sad", ru: "грустный" },
    { en: "big", ru: "большой" },
    { en: "small", ru: "маленький" },
    { en: "red", ru: "красный" },
    { en: "blue", ru: "синий" }
];
let builderCurrentWord = null;
let builderLives = 3;
let builderScore = 0;
let builderSlots = [];
let builderPoolLetters = [];

function renderWordBuilderPage(main) {
    builderLives = 3;
    builderScore = 0;
    pickBuilderWord();
    main.innerHTML = `
        <div class="game-window" style="max-width:500px; margin:auto;">
            <div style="background:#f0f0f0; border:3px solid #555; border-radius:8px; box-shadow:6px 6px 0 #333; padding:0;">
                <div style="background:#ddd; padding:8px 12px; display:flex; align-items:center; gap:8px; border-bottom:3px solid #999;">
                    <button onclick="showPage('word')" style="width:14px;height:14px;background:#ff5f57;border:2px solid #cc0000;border-radius:0;cursor:pointer;padding:0;font-size:0;"></button>
                    <button onclick="showPage('word')" style="width:14px;height:14px;background:#ffbd2e;border:2px solid #cc8800;border-radius:0;cursor:pointer;padding:0;font-size:0;"></button>
                    <button onclick="alert('И так хорошо!')" style="width:14px;height:14px;background:#27c93f;border:2px solid #008800;border-radius:0;cursor:pointer;padding:0;font-size:0;"></button>
                    <span style="font-size:8px;color:#333;margin-left:10px;flex:1;text-align:center;">Word Builder</span>
                </div>
                <div style="padding:15px; background:#fff;">
                    <div style="display:flex; justify-content:space-between; margin-bottom:10px; font-size:8px;">
                        <span>⭐ <span id="builderScore">0</span></span>
                        <span id="builderLives">❤️❤️❤️</span>
                    </div>
                    <p style="font-size:8px; text-align:center;">Собери слово: <strong id="builderWordHint">${builderCurrentWord.ru}</strong></p>
                    <div class="builder-container">
                        <div class="slots" id="slotsContainer"></div>
                        <div class="letter-pool" id="letterPool"></div>
                    </div>
                    <div class="word-builder-buttons" style="text-align:center; margin-top:12px;">
                        <button onclick="checkBuilderWord()" style="font-size:9px; padding:10px 20px;">✅ Проверить</button>
                        <button onclick="resetBuilder()" style="font-size:9px; padding:10px 20px;">🔄 Сбросить</button>
                    </div>
                    <div id="builderMsg" class="mickey-hint" style="text-align:center;"></div>
                </div>
            </div>
        </div>`;
    initBuilder();
}

function pickBuilderWord() {
    builderCurrentWord = builderWords[Math.floor(Math.random() * builderWords.length)];
}

function initBuilder() {
    const slotsContainer = document.getElementById('slotsContainer');
    if (!slotsContainer) return;
    slotsContainer.innerHTML = '';
    builderSlots = [];
    for (let i = 0; i < builderCurrentWord.en.length; i++) {
        const slot = document.createElement('div');
        slot.className = 'slot';
        slot.dataset.index = i;
        slot.addEventListener('click', function() {
            removeFromSlot(parseInt(this.dataset.index));
        });
        slotsContainer.appendChild(slot);
        builderSlots.push({ element: slot, letter: null });
    }

    const letters = builderCurrentWord.en.split('');
    const alphabet = 'abcdefghijklmnopqrstuvwxyz';
    const extraCount = Math.min(3, Math.floor(letters.length / 2));
    for (let i = 0; i < extraCount; i++) {
        let extraLetter;
        do {
            extraLetter = alphabet[Math.floor(Math.random() * alphabet.length)];
        } while (letters.includes(extraLetter));
        letters.push(extraLetter);
    }
    for (let i = letters.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [letters[i], letters[j]] = [letters[j], letters[i]];
    }
    builderPoolLetters = letters;
    renderPool();
}

function renderPool() {
    const pool = document.getElementById('letterPool');
    if (!pool) return;
    pool.innerHTML = '';
    builderPoolLetters.forEach((letter, index) => {
        const block = document.createElement('div');
        block.className = 'letter-block';
        block.textContent = letter;
        block.dataset.letter = letter;
        block.dataset.poolIndex = index;
        block.addEventListener('click', function() {
            placeToSlot(this.dataset.letter, parseInt(this.dataset.poolIndex));
        });
        pool.appendChild(block);
    });
    updateSlots();
}

function placeToSlot(letter, poolIndex) {
    const freeSlot = builderSlots.find(s => s.letter === null);
    if (!freeSlot) return;
    builderPoolLetters.splice(poolIndex, 1);
    freeSlot.letter = letter;
    freeSlot.element.textContent = letter;
    freeSlot.element.classList.add('filled');
    renderPool();
}

function removeFromSlot(slotIndex) {
    const slot = builderSlots[slotIndex];
    if (!slot || slot.letter === null) return;
    builderPoolLetters.push(slot.letter);
    slot.letter = null;
    slot.element.textContent = '';
    slot.element.classList.remove('filled');
    renderPool();
}

function updateSlots() {
    builderSlots.forEach((slot, i) => {
        if (slot.letter) {
            slot.element.textContent = slot.letter;
            slot.element.classList.add('filled');
        } else {
            slot.element.textContent = '';
            slot.element.classList.remove('filled');
        }
    });
}

function checkBuilderWord() {
    const userWord = builderSlots.map(s => s.letter || '').join('');
    const msg = document.getElementById('builderMsg');
    if (userWord === builderCurrentWord.en) {
        builderScore += 10;
        document.getElementById('builderScore').textContent = builderScore;
        if (msg) msg.textContent = '✅ Правильно! Микки рад! 🐱';
        
        // Запускаем конфетти
        spawnConfetti();
        
        setTimeout(() => { resetBuilder(); if (msg) msg.textContent = ''; }, 1200);
    } else {
        builderLives--;
        updateBuilderLives();
        if (builderLives <= 0) {
            if (msg) msg.textContent = '💔 Игра окончена! Счёт: ' + builderScore;
            setTimeout(() => showPage('word'), 1500);
        } else {
            if (msg) msg.textContent = '❌ Неправильно! Осталось жизней: ' + builderLives;
            setTimeout(() => { resetBuilder(); if (msg) msg.textContent = ''; }, 1000);
        }
    }
}

// ===== КОНФЕТТИ =====
function spawnConfetti() {
    const colors = ['#ff5f57', '#ffbd2e', '#27c93f', '#4a90d9', '#ff6fb5', '#f0b27a', '#a29bfe', '#fd79a8'];
    const container = document.querySelector('.game-window') || document.body;
    
    for (let i = 0; i < 40; i++) {
        const confetti = document.createElement('div');
        const size = Math.random() * 10 + 6;
        const color = colors[Math.floor(Math.random() * colors.length)];
        const startX = Math.random() * 100;
        const startY = -20;
        const angle = (Math.random() - 0.5) * 60;
        const velocity = Math.random() * 4 + 3;
        const rotation = Math.random() * 720;
        
        confetti.style.cssText = `
            position: fixed;
            left: ${startX}%;
            top: ${startY}px;
            width: ${size}px;
            height: ${size}px;
            background: ${color};
            border: 2px solid rgba(0,0,0,0.3);
            image-rendering: pixelated;
            pointer-events: none;
            z-index: 9999;
            animation: confettiFall ${Math.random() * 1.5 + 1.5}s ease-out forwards;
            transform: rotate(0deg);
        `;
        
        container.appendChild(confetti);
        
        // Добавляем уникальную анимацию для каждого кусочка
        const keyframes = `
            @keyframes confettiFall {
                0% {
                    transform: translateY(0) translateX(0) rotate(0deg);
                    opacity: 1;
                }
                100% {
                    transform: translateY(${window.innerHeight + 50}px) translateX(${angle * 5}px) rotate(${rotation}deg);
                    opacity: 0;
                }
            }
        `;
        
        const style = document.createElement('style');
        style.textContent = keyframes;
        document.head.appendChild(style);
        
        // Удаляем конфетти после анимации
        setTimeout(() => {
            confetti.remove();
            style.remove();
        }, 3000);
    }
}

function resetBuilder() {
    pickBuilderWord();
    const hint = document.getElementById('builderWordHint');
    if (hint) hint.textContent = builderCurrentWord.ru;
    initBuilder();
}

function updateBuilderLives() {
    const livesEl = document.getElementById('builderLives');
    if (livesEl) {
        livesEl.textContent = '❤️'.repeat(builderLives) + '🖤'.repeat(3 - builderLives);
    }
}

// ===== ЗАПУСК =====
renderPage();
    </script>
