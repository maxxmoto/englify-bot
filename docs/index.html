<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Englify – учи английский с Микки</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #fefaf3; --card-bg: #ffffff; --border: #e0b88a; --dark: #4a3b2f;
            --accent: #ffd9b0; --hover: #ffc489; --text: #4a3b2f; --header-bg: #ffd9b0;
            --modal-bg: #fefaf3; --input-bg: #fff; --progress-bg: #e0d6c2; --progress-fill: #ffd9b0;
        }
        body.theme-night {
            --bg: #1a1a2e; --card-bg: #16213e; --border: #533483; --dark: #e0d6ff;
            --accent: #3c2a6b; --hover: #5a3d8a; --text: #e0d6ff; --header-bg: #0f3460;
            --modal-bg: #16213e; --input-bg: #1a1a2e; --progress-bg: #2a2a4a; --progress-fill: #533483;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Press Start 2P', cursive; background: var(--bg); color: var(--text);
            min-height: 100vh; transition: background 0.5s, color 0.5s;
            background-image: url('day.jpg'); background-size: cover;
            background-attachment: fixed; background-position: center;
            position: relative; overflow-x: hidden;
        }
        body.theme-night { background-image: url('night.jpg'); background-color: #1a1a2e; }

        /* Облака */
        .sky { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: hidden; }
        .cloud { position: absolute; image-rendering: pixelated; will-change: transform; }
        body.theme-day .cloud { width: 160px; height: 60px; background: #ffffff; border: 3px solid #d0d0d0; box-shadow: -40px -20px 0 0 #fff, -20px -20px 0 0 #fff, 0px -20px 0 0 #fff, 20px -20px 0 0 #fff, 40px -20px 0 0 #fff, -50px -10px 0 0 #fff, 50px -10px 0 0 #fff, -40px 0px 0 0 #fff, -20px 0px 0 0 #fff, 20px 0px 0 0 #fff, 40px 0px 0 0 #fff; opacity: 0.9; }
        body.theme-night .cloud { width: 160px; height: 60px; background: #4a3578; border: 3px solid #6b4fa0; box-shadow: -40px -20px 0 0 #4a3578, -20px -20px 0 0 #4a3578, 0px -20px 0 0 #4a3578, 20px -20px 0 0 #4a3578, 40px -20px 0 0 #4a3578, -50px -10px 0 0 #4a3578, 50px -10px 0 0 #4a3578, -40px 0px 0 0 #4a3578, -20px 0px 0 0 #4a3578, 20px 0px 0 0 #4a3578, 40px 0px 0 0 #4a3578; opacity: 0.7; }
        .cloud1 { top: 3%; --scale: 0.7; animation: float1 30s linear infinite; left: -200px; }
        .cloud2 { top: 15%; --scale: 1.3; animation: float2 40s linear 6s infinite; left: -320px; }
        .cloud3 { top: 28%; --scale: 0.55; animation: float3 35s linear 12s infinite; left: -260px; }
        .cloud4 { top: 42%; --scale: 1.1; animation: float4 45s linear 18s infinite; left: -380px; }
        .cloud5 { top: 55%; --scale: 0.85; animation: float5 50s linear 24s infinite; left: -300px; }
        .cloud6 { top: 68%; --scale: 1.05; animation: float1 38s linear 10s infinite; left: -350px; }
        .cloud7 { top: 78%; --scale: 0.75; animation: float2 42s linear 16s infinite; left: -280px; }
        .cloud8 { top: 88%; --scale: 0.95; animation: float3 47s linear 22s infinite; left: -400px; }
        @keyframes float1 { 0% { transform: translateX(0) scale(var(--scale)); } 100% { transform: translateX(calc(100vw + 600px)) scale(var(--scale)); } }
        @keyframes float2 { 0% { transform: translateX(0) scale(var(--scale)); } 100% { transform: translateX(calc(100vw + 600px)) scale(var(--scale)); } }
        @keyframes float3 { 0% { transform: translateX(0) scale(var(--scale)); } 100% { transform: translateX(calc(100vw + 600px)) scale(var(--scale)); } }
        @keyframes float4 { 0% { transform: translateX(0) scale(var(--scale)); } 100% { transform: translateX(calc(100vw + 600px)) scale(var(--scale)); } }
        @keyframes float5 { 0% { transform: translateX(0) scale(var(--scale)); } 100% { transform: translateX(calc(100vw + 600px)) scale(var(--scale)); } }

        /* Шапка */
        header { background: var(--header-bg); padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--border); position: relative; z-index: 100; transition: background 0.5s; }
        .logo-img { height: 50px; image-rendering: pixelated; }
        .header-right { display: flex; align-items: center; gap: 8px; }
        .theme-btn { background: none; border: none; cursor: pointer; padding: 0; }
        .theme-icon { width: 28px; height: 28px; image-rendering: pixelated; }
        .burger-btn { display: flex; flex-direction: column; gap: 5px; background: none; border: none; cursor: pointer; padding: 8px; }
        .burger-btn span { display: block; width: 25px; height: 3px; background: var(--dark); border-radius: 1px; transition: 0.3s; }
        .burger-btn.active span:nth-child(1) { transform: rotate(45deg) translate(6px,6px); }
        .burger-btn.active span:nth-child(2) { opacity: 0; }
        .burger-btn.active span:nth-child(3) { transform: rotate(-45deg) translate(6px,-6px); }
        .mobile-nav { display: flex; position: fixed; top: 0; right: -100%; width: 75%; max-width: 280px; height: 100vh; background: var(--accent); border-left: 4px solid var(--border); padding: 80px 15px 20px; flex-direction: column; gap: 12px; z-index: 200; transition: right 0.3s; }
        .mobile-nav.active { right: 0; }
        .mobile-nav a { font-size: 10px; padding: 12px; border: 2px solid var(--border); background: var(--card-bg); text-decoration: none; color: var(--text); text-align: center; display: block; }

        /* Карточки */
        .card { background: var(--card-bg); border: 3px solid var(--border); box-shadow: 4px 4px 0 #d9a36a; padding: 20px; margin: 20px auto; max-width: 500px; text-align: center; font-size: 9px; line-height: 1.8; position: relative; z-index: 10; transition: background 0.5s, border-color 0.5s, box-shadow 0.5s; }
        .word { font-size: 24px; margin: 10px 0; }
        .option-btn, .grammar-topic-btn { font-family: inherit; background: var(--accent); border: 2px solid var(--border); padding: 12px; cursor: pointer; font-size: 9px; text-decoration: none; color: var(--text); display: block; text-align: center; margin: 6px 0; transition: background 0.2s; }
        .option-btn:hover, .grammar-topic-btn:hover { background: var(--hover); }
        .option-btn.correct { background: #b2f0b2; }
        .option-btn.wrong { background: #f0b2b2; }
        button { font-family: inherit; background: var(--accent); border: 2px solid var(--border); padding: 10px 14px; cursor: pointer; font-size: 9px; color: var(--text); transition: background 0.2s; }
        button:hover { background: var(--hover); }
        .actions { display: flex; gap: 8px; margin-top: 15px; flex-wrap: wrap; justify-content: center; }
        .progress-bar-container { width: 100%; height: 20px; background: var(--progress-bg); border: 2px solid #b8a587; margin: 10px 0; }
        .progress-bar { height: 100%; background: var(--progress-fill); width: 0%; transition: width 0.3s; }
        footer { text-align: center; font-size: 7px; padding: 20px; position: relative; z-index: 10; color: var(--text); }
        .mickey-hint { font-size: 8px; margin-top: 10px; color: #b87450; }
        #wordList { list-style: none; padding: 0; text-align: left; }
        #wordList li { padding: 10px; border: 2px solid var(--border); margin-bottom: 6px; background: #fffdf7; font-size: 8px; word-break: break-word; }
        .task-input-area { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; justify-content: center; }
        .pixel-input { font-family: inherit; font-size: 9px; padding: 10px; border: 3px solid var(--border); background: var(--input-bg); color: var(--text); outline: none; width: 100%; max-width: 250px; }
        .task-nav { display: flex; justify-content: space-between; margin-top: 15px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .modal.show { display: flex; }
        .modal-content { background: var(--modal-bg); border: 4px solid var(--border); padding: 25px; max-width: 600px; width: 100%; font-size: 9px; line-height: 1.6; position: relative; flex-direction: column; align-items: center; text-align: center; }
        .close-btn { position: absolute; top: 10px; right: 15px; background: none; border: none; font-size: 22px; cursor: pointer; color: var(--text); }
    </style>
</head>
<body class="theme-day">

    <!-- Облака -->
    <div class="sky">
        <div class="cloud cloud1"></div><div class="cloud cloud2"></div><div class="cloud cloud3"></div>
        <div class="cloud cloud4"></div><div class="cloud cloud5"></div><div class="cloud cloud6"></div>
        <div class="cloud cloud7"></div><div class="cloud cloud8"></div>
    </div>

    <!-- Шапка -->
    <header>
        <img id="logoImg" src="logo.png" alt="Englify" class="logo-img">
        <div class="header-right">
            <button class="theme-btn" onclick="toggleTheme()">
                <img id="themeIcon" src="daymod.png" class="theme-icon" alt="Тема">
            </button>
            <button class="burger-btn" id="burgerBtn" onclick="toggleMenu()">
                <span></span><span></span><span></span>

        </div>
        <div class="mobile-nav" id="mobileNav">
            <a href="#" onclick="showPage('word')">🏠 Слово дня</a>
            <a href="#" onclick="showPage('tasks')">📝 Задания</a>
            <a href="#" onclick="showPage('verbs')">🐾 Глаголы</a>
            <a href="#" onclick="showPage('grammar')">📘 Грамматика</a>
            <a href="#" onclick="showPage('words')">📚 Словарь</a>
            <a href="#" onclick="showPage('pro')">⭐ Pro</a>
            <a href="#" onclick="showPage('game')">🎮 Игра</a>
        </div>
    </header>

    <!-- Контент -->
    <main id="mainContent"></main>

    <footer>Микки всегда рядом 🐱<br><a href="https://t.me/engliFLY_bot" style="color:inherit;">Открыть бота</a></footer>

    <script>
        // ===== ДАННЫЕ (захардкожены) =====
        const WORDS = ["abandon","ability","able","about","above","abroad","absence","absolute","absorb","abstract","abundant","academic","accelerate","accept","access","accident","accompany","accomplish","account","accurate","achieve","acknowledge","acquire","adapt","add","address","adequate","adjust","admire","admit","adopt","adult","advance","advantage","adventure","advertise","advice","affair","affect","afford","afraid","afternoon","again","age","agree","ahead","aim","air","airplane","alarm","album","alive","allow","almost","alone","along","already","also","although","among","amount","amuse","ancient","anger","angle","announce","annual","anxiety","apart","apologize","apparent","appear","appetite","apply","appreciate","approach","argument","arm","arrange","arrest","arrive","art","article","ashamed","aspect","assist","associate","assume","atmosphere","attach","attempt","attend","attention","attract","audience","author","autumn","available","average","avoid","awake","award","aware","awful","awkward","back","background","balance","ball","ban","bank","base","bath","battle","beach","bear","beat","beautiful","because","become","beef","beg","begin","behave","behind","believe","bell","belong","below","belt","bend","benefit","bet","beyond","bill","bin","bit","bitter","blame","blank","blind","block","blood","blow","board","boat","boil","bold","bomb","bone","book","border","borrow","boss","bother","bottle","bottom","bowl","box","boy","brain","branch","brand","brave","bread","break","breakfast","breath","brick","bridge","brief","bright","brilliant","bring","broad","broadcast","brother","brown","brush","budget","build","bullet","bunch","burn","burst","bury","bus","bush","business","butter","button","buy","cabin","cabinet","cable","cake","calculate","call","calm","camera","camp","cancel","candidate","cap","capable","capital","capture","car","card","care","career","carpet","carry","case","cash","cast","cat","catch","category","cause","celebrate","cell","center","century","certain","chain","chair","challenge","champion","chance","change","channel","chapter","character","charge","charity","chat","cheap","cheat","check","cheek","cheese","chef","chemical","chest","chicken","chief","child","chin","chocolate","choice","choose","church","cigarette","circle","citizen","city","claim","class","clean","clear","clever","click","climate","climb","clock","close","cloth","cloud","club","coach","coal","coast","coat","code","coffee","coin","cold","collar","collect","college","colour","column","combine","comfort","command","comment","commit","committee","common","communicate","community","company","compare","compete","complain","complete","complex","computer","concentrate","concept","concern","conclude","condition","conduct","conference","confidence","confirm","conflict","confuse","connect","conscious","consequence","consider","constant","construct","contact","contain","content","contest","continue","contract","contrast","contribute","control","convenient","conversation","convince","cook","cool","cooperate","copy","corner","correct","cost","cotton","cough","council","count","country","couple","courage","course","court","cover","crash","create","credit","crime","criminal","crisis","criticize","crop","cross","crowd","cry","culture","cup","cure","curious","current","curtain","curve","customer","cut","cycle","dad","daily","damage","dance","danger","dark","data","database","daughter","dawn","dead","deal","dear","debate","debt","decade","decide","decision","declare","decorate","deep","defend","define","degree","delay","deliver","demand","democracy","department","depend","describe","desert","deserve","design","desire","desk","destroy","detail","determine","develop","device","dialog","diary","dictate","die","differ","dig","digital","dinner","direct","disappear","discover","discuss","disease","display","distance","distribute","district","diverse","divide","divorce","document","dog","donate","door","double","doubt","down","download","draft","drag","drama","draw","dream","dress","drink","drive","drop","dry","duck","due","dull","dust","duty"];
        const IRREGULAR_VERBS = [
            {v1:"be",v2:"was/were",v3:"been",t:"быть"},{v1:"become",v2:"became",v3:"become",t:"становиться"},
            {v1:"begin",v2:"began",v3:"begun",t:"начинать"},{v1:"break",v2:"broke",v3:"broken",t:"ломать"},
            {v1:"bring",v2:"brought",v3:"brought",t:"приносить"},{v1:"build",v2:"built",v3:"built",t:"строить"},
            {v1:"buy",v2:"bought",v3:"bought",t:"покупать"},{v1:"catch",v2:"caught",v3:"caught",t:"ловить"},
            {v1:"choose",v2:"chose",v3:"chosen",t:"выбирать"},{v1:"come",v2:"came",v3:"come",t:"приходить"},
            {v1:"do",v2:"did",v3:"done",t:"делать"},{v1:"draw",v2:"drew",v3:"drawn",t:"рисовать"},
            {v1:"drink",v2:"drank",v3:"drunk",t:"пить"},{v1:"drive",v2:"drove",v3:"driven",t:"водить"},
            {v1:"eat",v2:"ate",v3:"eaten",t:"есть"},{v1:"fall",v2:"fell",v3:"fallen",t:"падать"},
            {v1:"feel",v2:"felt",v3:"felt",t:"чувствовать"},{v1:"find",v2:"found",v3:"found",t:"находить"},
            {v1:"fly",v2:"flew",v3:"flown",t:"летать"},{v1:"forget",v2:"forgot",v3:"forgotten",t:"забывать"},
            {v1:"get",v2:"got",v3:"got/gotten",t:"получать"},{v1:"give",v2:"gave",v3:"given",t:"давать"},
            {v1:"go",v2:"went",v3:"gone",t:"идти"},{v1:"grow",v2:"grew",v3:"grown",t:"расти"},
            {v1:"have",v2:"had",v3:"had",t:"иметь"},{v1:"hear",v2:"heard",v3:"heard",t:"слышать"},
            {v1:"hide",v2:"hid",v3:"hidden",t:"прятать"},{v1:"hit",v2:"hit",v3:"hit",t:"ударять"},
            {v1:"hold",v2:"held",v3:"held",t:"держать"},{v1:"keep",v2:"kept",v3:"kept",t:"хранить"},
            {v1:"know",v2:"knew",v3:"known",t:"знать"},{v1:"lead",v2:"led",v3:"led",t:"вести"},
            {v1:"leave",v2:"left",v3:"left",t:"покидать"},{v1:"lend",v2:"lent",v3:"lent",t:"одалживать"},
            {v1:"let",v2:"let",v3:"let",t:"позволять"},{v1:"lose",v2:"lost",v3:"lost",t:"терять"},
            {v1:"make",v2:"made",v3:"made",t:"делать"},{v1:"mean",v2:"meant",v3:"meant",t:"значить"},
            {v1:"meet",v2:"met",v3:"met",t:"встречать"},{v1:"pay",v2:"paid",v3:"paid",t:"платить"},
            {v1:"put",v2:"put",v3:"put",t:"класть"},{v1:"read",v2:"read",v3:"read",t:"читать"},
            {v1:"ride",v2:"rode",v3:"ridden",t:"ехать"},{v1:"ring",v2:"rang",v3:"rung",t:"звонить"},
            {v1:"run",v2:"ran",v3:"run",t:"бежать"},{v1:"say",v2:"said",v3:"said",t:"сказать"},
            {v1:"see",v2:"saw",v3:"seen",t:"видеть"},{v1:"sell",v2:"sold",v3:"sold",t:"продавать"},
            {v1:"send",v2:"sent",v3:"sent",t:"посылать"},{v1:"sing",v2:"sang",v3:"sung",t:"петь"},
            {v1:"sit",v2:"sat",v3:"sat",t:"сидеть"},{v1:"sleep",v2:"slept",v3:"slept",t:"спать"},
            {v1:"speak",v2:"spoke",v3:"spoken",t:"говорить"},{v1:"spend",v2:"spent",v3:"spent",t:"тратить"},
            {v1:"stand",v2:"stood",v3:"stood",t:"стоять"},{v1:"swim",v2:"swam",v3:"swum",t:"плавать"},
            {v1:"take",v2:"took",v3:"taken",t:"брать"},{v1:"teach",v2:"taught",v3:"taught",t:"учить"},
            {v1:"tell",v2:"told",v3:"told",t:"рассказывать"},{v1:"think",v2:"thought",v3:"thought",t:"думать"},
            {v1:"throw",v2:"threw",v3:"thrown",t:"бросать"},{v1:"understand",v2:"understood",v3:"understood",t:"понимать"},
            {v1:"wake",v2:"woke",v3:"woken",t:"будить"},{v1:"wear",v2:"wore",v3:"worn",t:"носить"},
            {v1:"win",v2:"won",v3:"won",t:"побеждать"},{v1:"write",v2:"wrote",v3:"written",t:"писать"}
        ];

        // ===== СОСТОЯНИЕ =====
        let currentPage = 'word';
        let lives = 3, streak = 0, level = 'novice';
        if (localStorage.getItem('engLives')) lives = parseInt(localStorage.getItem('engLives'));
        if (localStorage.getItem('engStreak')) streak = parseInt(localStorage.getItem('engStreak'));
        if (localStorage.getItem('engLevel')) level = localStorage.getItem('engLevel');

        // ===== НАВИГАЦИЯ =====
        function showPage(page) {
            currentPage = page;
            document.getElementById('mobileNav').classList.remove('active');
            document.getElementById('burgerBtn').classList.remove('active');
            renderPage();
        }

        function renderPage() {
            const main = document.getElementById('mainContent');
            switch(currentPage) {
                case 'word': renderWordPage(main); break;
                case 'tasks': renderTasksPage(main); break;
                case 'verbs': renderVerbsPage(main); break;
                case 'grammar': renderGrammarLevels(main); break;
                case 'words': renderWordsPage(main); break;
                case 'pro': renderProPage(main); break;
	        case 'game': renderGamePage(main); break;
                default: renderWordPage(main);
            }
        }

        // ===== СЛОВО ДНЯ =====
        function renderWordPage(main) {
            const day = new Date().getDate() % 365;
            const word = WORDS[day];
            main.innerHTML = `
                <div class="card">
                    <h2>🐱 Слово дня</h2>
                    <div class="word">${word}</div>
                    <div class="actions">
                        <button onclick="speak('${word}')">🔊 Озвучить</button>
                        <button onclick="learnWord('${word}')">✅ Выучил</button>
                    </div>
                    <div id="mickeyMsg" class="mickey-hint"></div>
                </div>
                <div class="card">
                    <h3>Прогресс</h3>
                    <div class="progress-bar-container"><div class="progress-bar" id="progressBar"></div></div>
                    <p id="progressText"></p>
                </div>`;
            updateProgress();
        }

        function speak(text) {
            const u = new SpeechSynthesisUtterance(text); u.lang = 'en-US'; speechSynthesis.speak(u);
        }

        function learnWord(word) {
            let learned = JSON.parse(localStorage.getItem('learnedWords')||'[]');
            if (!learned.includes(word)) {
                learned.push(word);
                localStorage.setItem('learnedWords', JSON.stringify(learned));
            }
            document.getElementById('mickeyMsg').textContent = 'Мяу! Слово сохранено!';
            updateProgress();
        }

        function updateProgress() {
            const learned = JSON.parse(localStorage.getItem('learnedWords')||'[]');
            const pct = Math.round((learned.length/365)*100);
            const bar = document.getElementById('progressBar');
            const txt = document.getElementById('progressText');
            if (bar) bar.style.width = pct + '%';
            if (txt) txt.textContent = learned.length + ' / 365 слов';
        }

        // ===== ЗАДАНИЯ =====
        function renderTasksPage(main) {
            const questions = {
                novice: [
                    {q:"Как переводится «apple»?",o:["Яблоко","Апельсин","Банан"],c:0},
                    {q:"She ___ a student.",o:["am","is","are"],c:1},
                    {q:"Выбери перевод: «run»",o:["Бежать","Прыгать","Плавать"],c:0}
                ],
                middle: [
                    {q:"Синоним «happy»:",o:["Glad","Sad","Angry"],c:0},
                    {q:"He ___ finished his work.",o:["has","have","had"],c:0},
                    {q:"If I ___ rich, I would travel.",o:["am","was","were"],c:2}
                ],
                pro: [
                    {q:"Never ___ such a beautiful sunset.",o:["I have seen","have I seen","I saw"],c:1},
                    {q:"Not only ___ the report, but she presented it.",o:["she finished","did she finish","she did finish"],c:1},
                    {q:"Idiom: «break the ice» means:",o:["Разбить лёд","Начать разговор","Замёрзнуть"],c:1}
                ]
            };
            const tasks = questions[level];
            let idx = 0, correctCount = 0;

            function show() {
                if (idx >= tasks.length) {
                    main.innerHTML = `<div class="card"><h2>🎉 Готово!</h2><p>Правильно: ${correctCount}/${tasks.length}</p><button onclick="showPage('tasks')">Ещё раз</button></div>`;
                    return;
                }
                const t = tasks[idx];
                main.innerHTML = `<div class="card">
                    <h2>📝 Задания (${level})</h2>
                    <p>${t.q}</p>
                    ${t.o.map((opt,i) => `<div class="option-btn" onclick="checkTaskAnswer(${i},${t.c})">${opt}</div>`).join('')}
                    <div id="taskMsg" class="mickey-hint"></div>
                </div>`;
            }

            window.checkTaskAnswer = (chosen, correct) => {
                const btns = document.querySelectorAll('.option-btn');
                btns.forEach((b,i) => {
                    b.style.pointerEvents = 'none';
                    if (i === correct) b.classList.add('correct');

let gameRunning = false;
let gameScore = 0;
let gameLives = 3;
let gameSpeed = 4;
let mickeyY = 300;
let mickeyVelY = 0;
let isJumping = false;
let obstacles = [];
let words = [];
let frameCount = 0;
let canvas, ctx;
let gameLoopId;
let spawnTimer = 0;
let gameWords = [
    { en: "cat", ru: "кошка" },

    { en: "moon", ru: "луна" },
    { en: "star", ru: "звезда" },
    { en: "happy", ru: "счастливый" },
    { en: "sad", ru: "грустный" }
];

function renderGamePage(main) {
    main.innerHTML = `
        <div class="card" style="max-width:600px; padding:10px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <span id="gameScore">⭐ 0</span>
                <span id="gameLives">❤️❤️❤️</span>
                <span id="gameBest">🏆 ${localStorage.getItem('mickeyRunnerBest') || 0}</span>
            </div>
            <canvas id="gameCanvas" width="380" height="400" 
                style="width:100%; height:auto; border:2px solid var(--border); image-rendering:pixelated; background:#87CEEB;">
            </canvas>

                🖱️ Тап / клик — прыжок<br>Собирай правильные переводы!
            </p>
            <button onclick="startGame()" id="gameStartBtn" style="margin-top:5px;">▶️ Играть</button>
            <button onclick="shareGameScore()" id="gameShareBtn" style="display:none; margin-top:5px;">📤 Поделиться рекордом</button>
        </div>`;
}

function startGame() {
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d');
    gameScore = 0;
    gameLives = 3;
    gameSpeed = 4;
    mickeyY = 280;
    mickeyVelY = 0;
    isJumping = false;
    obstacles = [];
    words = [];
    frameCount = 0;
    spawnTimer = 0;
    gameRunning = true;
    document.getElementById('gameStartBtn').style.display = 'none';
    document.getElementById('gameShareBtn').style.display = 'none';
    updateGameHUD();
    canvas.addEventListener('click', handleGameJump);
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleGameJump(); });
    gameLoopId = requestAnimationFrame(gameLoop);
}

function handleGameJump() {
    if (!gameRunning) return;
    if (!isJumping) {
        mickeyVelY = -12;
        isJumping = true;
    }
}

function gameLoop() {
    if (!gameRunning) return;
    updateGame();
    drawGame();
    gameLoopId = requestAnimationFrame(gameLoop);
}

function updateGame() {
    frameCount++;
    // Гравитация
    mickeyVelY += 0.6;
    mickeyY += mickeyVelY;
    if (mickeyY >= 280) {
        mickeyY = 280;
        mickeyVelY = 0;
        isJumping = false;
    }

    // Спавн препятствий и слов
    spawnTimer++;
    if (spawnTimer > 80 - gameSpeed * 5) {
        spawnTimer = 0;
        if (Math.random() < 0.5) {
            // Препятствие
            obstacles.push({ x: 400, y: 280, w: 20, h: 30 });
        } else {
            // Слово
            const wordPair = gameWords[Math.floor(Math.random() * gameWords.length)];
            const isCorrect = Math.random() < 0.5;
            words.push({
                x: 400,
                y: 150 + Math.random() * 100,
                text: isCorrect ? wordPair.ru : wordPair.en,
                correct: isCorrect,
                pair: wordPair,
                collected: false
            });
        }
    }

    // Движение препятствий
    for (let obs of obstacles) {
        obs.x -= gameSpeed;
        // Проверка столкновения с Микки
        if (
            obs.x < 50 && obs.x + obs.w > 20 &&
            mickeyY + 40 > obs.y && mickeyY < obs.y + obs.h
        ) {
            gameLives--;
            obstacles = obstacles.filter(o => o !== obs);
            updateGameHUD();
            if (gameLives <= 0) {
                gameOver();
                return;
            }
        }
    }
    obstacles = obstacles.filter(obs => obs.x > -50);

    // Движение слов
    for (let w of words) {
        w.x -= gameSpeed;
        // Проверка сбора
        if (!w.collected && w.x < 50 && w.x > 10 &&
            mickeyY + 40 > w.y - 10 && mickeyY < w.y + 30) {
            w.collected = true;
            if (w.correct) {
                gameScore += 10;
                updateGameHUD();
            } else {
                gameLives--;
                updateGameHUD();
                if (gameLives <= 0) {
                    gameOver();
                    return;
                }
            }
        }
    }
    words = words.filter(w => w.x > -50 && !w.collected);

    // Увеличение скорости
    if (gameScore > 0 && gameScore % 50 === 0) {
        gameSpeed += 0.2;
    }
}

function drawGame() {
    ctx.clearRect(0, 0, 380, 400);

    // Небо
    ctx.fillStyle = '#87CEEB';
    ctx.fillRect(0, 0, 380, 280);
    // Земля
    ctx.fillStyle = '#8B4513';
    ctx.fillRect(0, 310, 380, 90);

    // Микки (пиксельный кот)
    ctx.fillStyle = '#FFD9B0';
    ctx.fillRect(30, mickeyY, 20, 20); // тело
    ctx.fillStyle = '#000';
    ctx.fillRect(32, mickeyY + 4, 4, 4); // глаз
    ctx.fillRect(40, mickeyY + 4, 4, 4); // глаз
    ctx.fillStyle = '#FFC489';
    ctx.fillRect(26, mickeyY + 12, 6, 4); // лапа
    ctx.fillRect(44, mickeyY + 12, 6, 4); // лапа

    // Препятствия
    ctx.fillStyle = '#555';
    for (let obs of obstacles) {
        ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
        // шипы
        ctx.fillStyle = '#FF0000';
        ctx.fillRect(obs.x + 2, obs.y - 5, 4, 5);
        ctx.fillRect(obs.x + 14, obs.y - 5, 4, 5);
        ctx.fillStyle = '#555';
    }

    // Слова
    ctx.font = '10px "Press Start 2P"';
    for (let w of words) {
        ctx.fillStyle = w.correct ? '#00AA00' : '#AA0000';
        ctx.fillText(w.text, w.x, w.y);
    }

    // HUD внутри canvas (мелкий шрифт)
    ctx.fillStyle = '#000';
    ctx.font = '8px "Press Start 2P"';
    ctx.fillText('⭐ ' + gameScore, 10, 15);
    ctx.fillText('❤️'.repeat(gameLives), 300, 15);
}

function updateGameHUD() {
    document.getElementById('gameScore').textContent = '⭐ ' + gameScore;
    document.getElementById('gameLives').textContent = '❤️'.repeat(gameLives) + '🖤'.repeat(3 - gameLives);
    document.getElementById('gameBest').textContent = '🏆 ' + (localStorage.getItem('mickeyRunnerBest') || 0);
}

function gameOver() {
    gameRunning = false;
    cancelAnimationFrame(gameLoopId);
    canvas.removeEventListener('click', handleGameJump);
    canvas.removeEventListener('touchstart', handleGameJump);
    document.getElementById('gameStartBtn').style.display = 'inline-block';
    document.getElementById('gameStartBtn').textContent = '🔄 Заново';
    document.getElementById('gameShareBtn').style.display = 'inline-block';
    const best = parseInt(localStorage.getItem('mickeyRunnerBest') || 0);
    if (gameScore > best) {
        localStorage.setItem('mickeyRunnerBest', gameScore);
        document.getElementById('gameBest').textContent = '🏆 ' + gameScore;
    }
    updateGameHUD();
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, 380, 400);
    ctx.fillStyle = '#FFF';
    ctx.font = '12px "Press Start 2P"';
    ctx.fillText('GAME OVER', 120, 180);
    ctx.font = '8px "Press Start 2P"';
    ctx.fillText('Score: ' + gameScore, 150, 210);
}

function shareGameScore() {
    const best = localStorage.getItem('mickeyRunnerBest') || 0;
    const text = `🐱 Я набрал ${gameScore} очков в Mickey Runner! (Рекорд: ${best})\nПопробуй Englify: https://t.me/engliFLY_bot`;
    if (navigator.share) {
        navigator.share({ title: 'Mickey Runner', text: text });
    } else {
        // Копируем в буфер обмена
        navigator.clipboard.writeText(text).then(() => {
            alert('Результат скопирован! Отправь другу.');
        });
    }
}
